<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>NAXER — kalkulator historyczny</title>
<style>
  /* ============================================================
     ZMIENNE I BAZA
     ============================================================ */
  :root {
    --bg: #000;
    --panel: rgba(8, 11, 20, 0.78);
    --panel-border: rgba(110, 140, 255, 0.18);
    --text: #e8ecf8;
    --muted: #8b95b3;
    --accent: #5b86ff;          /* akcent interfejsu (jasniejszy niz logo, dla czytelnosci) */
    --up: #4ade9c;
    --down: #ff6b7d;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  /* ============================================================
     TLO: ZORZA POLARNA (canvas) + przyciemnienie dolu pod panel
     ============================================================ */
  #aurora {
    position: fixed; inset: 0; width: 100%; height: 100%;
    z-index: 0; pointer-events: none;
    filter: blur(14px);          /* lekki blur robi CSS - dziala tez w Safari */
    transform: scale(1.06);      /* zeby rozmyte krawedzie nie odslanialy czerni */
  }
  .shade { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.7) 100%); }

  /* ============================================================
     UKLAD STRONY: logo u gory, kalkulator na dole
     ============================================================ */
  .page { position: relative; z-index: 2; min-height: 100vh; min-height: 100dvh;
    display: flex; flex-direction: column; padding: 0 16px 28px; }
  header { text-align: center; padding-top: clamp(28px, 7vh, 72px); }
  main { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-top: 40px; }

  /* ============================================================
     LOGO "NAXER": ciemny niebieski neon + glow + flicker
     Kolor celowo ciemniejszy (#1e40e6); widocznosc na czerni daje
     wielowarstwowa poswiata w tym samym odcieniu.
     ============================================================ */
  .logo {
    margin: 0; display: inline-block;
    font-size: clamp(3.4rem, 15vw, 8rem); font-weight: 900; letter-spacing: 0.2em;
    padding-left: 0.2em;                      /* wyrownuje optycznie letter-spacing */
    color: #1e40e6;                           /* wypelnienie: ciemny niebieski */
    -webkit-text-stroke: 2px #8fb0ff;         /* jasny, cienki kontur = wyrazny brzeg liter */
    paint-order: stroke fill;
    text-shadow:
      0 0 3px  rgba(200, 220, 255, 0.9),
      0 0 10px rgba(90, 130, 255, 1),
      0 0 24px rgba(50, 90, 255, 0.95),
      0 0 50px rgba(30, 64, 230, 0.9),
      0 0 90px rgba(24, 50, 190, 0.8),
      0 0 150px rgba(16, 34, 150, 0.65);
    animation: flicker 7s infinite;
    user-select: none;
  }
  .tagline { margin: 6px 0 0; font-size: 0.78rem; letter-spacing: 0.32em; text-transform: uppercase; color: var(--muted); }
  /* migotanie co ~7 s: krotka seria przygasniec, poza tym stabilne */
  @keyframes flicker {
    0%, 88%, 100% { opacity: 1; }
    89% { opacity: 0.35; }
    90% { opacity: 1; }
    91% { opacity: 0.5; }
    92.5% { opacity: 1; }
    93% { opacity: 0.7; }
    94% { opacity: 1; }
  }

  /* ============================================================
     KALKULATOR (panel "fintech / premium")
     ============================================================ */
  .calc { width: 100%; max-width: 820px; background: var(--panel); border: 1px solid var(--panel-border);
    border-radius: 20px; padding: clamp(18px, 4vw, 30px);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255,255,255,0.04); }

  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 640px) { .fields { grid-template-columns: 1fr; } }
  .field label { display: block; font-size: 0.74rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 7px; }
  .field input { width: 100%; padding: 13px 14px; font-size: 1.15rem; font-family: var(--mono); color: var(--text);
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; }
  .field input::placeholder { color: #566079; }
  .field input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,134,255,0.22); }
  .field input[aria-invalid="true"] { border-color: var(--down); }
  .readout { display: block; width: 100%; padding: 13px 14px; font-size: 1.15rem; font-family: var(--mono); color: var(--accent);
    background: rgba(91,134,255,0.07); border: 1px dashed rgba(91,134,255,0.35); border-radius: 12px; min-height: 52px; }
  .split { margin-top: 16px; padding: 16px; border-radius: 14px; border: 1px solid rgba(91,134,255,0.35); background: rgba(91,134,255,0.06); }
  .split .head { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; }
  .split .line { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 7px 0; border-top: 1px solid rgba(255,255,255,0.06); font-size: 0.88rem; }
  .split .line:first-of-type { border-top: none; }
  .split .line b { font-family: var(--mono); font-size: 1.05rem; white-space: nowrap; }
  .split .line.total { font-weight: 700; }
  .split .line.total b { font-size: 1.3rem; color: var(--accent); }
  .err { min-height: 1.1em; margin: 6px 2px 0; font-size: 0.76rem; color: var(--down); }

  .summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 8px; }
  @media (max-width: 640px) { .summary { grid-template-columns: 1fr; } }
  .tile { background: rgba(255,255,255,0.035); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 14px 16px; }
  .tile .k { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .tile .v { margin-top: 6px; font-size: 1.25rem; font-weight: 700; font-family: var(--mono); overflow-wrap: anywhere; }
  .tile .v.up { color: var(--up); } .tile .v.down { color: var(--down); }
  .placeholder { margin: 8px 0 0; padding: 16px; text-align: center; font-size: 0.88rem; color: var(--muted);
    border: 1px dashed rgba(255,255,255,0.14); border-radius: 14px; }

  .table-wrap { margin-top: 16px; max-height: 340px; overflow: auto; border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  caption { text-align: left; padding: 10px 14px; font-size: 0.74rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  th, td { padding: 9px 14px; text-align: right; border-top: 1px solid rgba(255,255,255,0.06); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { position: sticky; top: 0; background: #0b0f1c; color: var(--muted); font-weight: 600; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; }
  td { font-family: var(--mono); }
  td.up { color: var(--up); } td.down { color: var(--down); }

  /* ============================================================
     ZASTRZEZENIA (obowiazkowe, mala czcionka)
     ============================================================ */
  .disclaimer { width: 100%; max-width: 820px; margin: 16px auto 0; padding: 0 6px; font-size: 0.72rem; line-height: 1.55; color: #7f89a6; }
  .disclaimer strong { color: #a6b0cc; }
  .disclaimer ul { margin: 6px 0 0; padding-left: 18px; }
  .disclaimer li { margin-bottom: 4px; }
  .disclaimer:empty { display: none; }

  /* link powrotu do panelu BizON (kopia w projekcie) */
  .back { position: fixed; top: 14px; left: 16px; z-index: 5; font-size: 0.78rem; color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.12); background: rgba(0,0,0,0.35); }
  .back:hover { color: var(--text); border-color: var(--accent); }

  @media (prefers-reduced-motion: reduce) { .logo { animation: none; } }
</style>
</head>
<body>
  <canvas id="aurora" aria-hidden="true"></canvas>
  <div class="shade" aria-hidden="true"></div>
  <a class="back" href="dashboard.html">&larr; BizON</a>

  <div class="page">
    <header>
      <h1 class="logo">NAXER</h1>
      <p class="tagline">AB Azure Capital Group</p>
    </header>

    <main>
      <section class="calc" aria-label="Kalkulator">
        <div class="fields">
          <div class="field">
            <label for="amount">Kwota wpłaty (PLN)</label>
            <input id="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="np. 10 000" aria-describedby="amount-err">
            <p class="err" id="amount-err" role="alert"></p>
          </div>
          <div class="field">
            <label for="rate-out">Zakładana stopa zysku (rocznie)</label>
            <output id="rate-out" class="readout" for="amount" aria-live="polite">—</output>
            <p class="err" id="tier-note" style="color: var(--muted);"></p>
          </div>
        </div>

        <div id="results" aria-live="polite">
          <p class="placeholder">Wpisz kwotę wpłaty, aby zobaczyć symulację.</p>
        </div>
      </section>

      <!-- NOTKA PRAWNA: wklej tutaj tekst od prawnika (zwykly HTML, np. <p>...</p>).
           Dopoki kontener jest pusty, nie jest wyswietlany. -->
      <div class="disclaimer" id="legal-note" role="note"></div>
    </main>
  </div>

<script>
/* ============================================================
   ZORZA POLARNA
   Kilka falujacych pasm ("kurtyn") rysowanych kolumna po kolumnie.
   Kazda kolumna to pionowy gradient (jasny dol, zanikajaca gora),
   skladany trybem 'lighter'. Rysujemy w polowie rozdzielczosci
   (wydajnosc), a blur i skalowanie robi CSS.
   ============================================================ */
(function aurora() {
  const canvas = document.getElementById('aurora');
  const ctx = canvas.getContext('2d');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const SCALE = 0.5, STEP = 3;
  let W = 0, H = 0;

  // kolory: niebieski, turkus, fiolet (rgb)
  const bands = [
    { c: [40, 110, 255], y: 0.34, amp: 0.10, f1: 0.0075, f2: 0.017, f3: 0.011, s1: 0.00021, s2: 0.00013, s3: 0.00017, th: 0.22, a: 0.50 },
    { c: [20, 220, 200], y: 0.42, amp: 0.08, f1: 0.0060, f2: 0.014, f3: 0.009, s1: 0.00016, s2: 0.00019, s3: 0.00012, th: 0.20, a: 0.42 },
    { c: [150, 80, 255], y: 0.30, amp: 0.11, f1: 0.0090, f2: 0.020, f3: 0.013, s1: 0.00013, s2: 0.00011, s3: 0.00021, th: 0.24, a: 0.42 },
    { c: [30, 170, 255], y: 0.50, amp: 0.07, f1: 0.0050, f2: 0.012, f3: 0.008, s1: 0.00019, s2: 0.00015, s3: 0.00010, th: 0.18, a: 0.32 },
    { c: [190, 90, 255], y: 0.46, amp: 0.09, f1: 0.0068, f2: 0.016, f3: 0.010, s1: 0.00011, s2: 0.00017, s3: 0.00014, th: 0.19, a: 0.30 }
  ];

  function resize() {
    W = canvas.width = Math.max(1, Math.ceil(innerWidth * SCALE));
    H = canvas.height = Math.max(1, Math.ceil(innerHeight * SCALE));
    // jeden gradient na pasmo, w "jednostkowej" przestrzeni y in [-1, 1]
    bands.forEach(b => {
      const g = ctx.createLinearGradient(0, -1, 0, 1);
      g.addColorStop(0.00, `rgba(${b.c}, 0)`);
      g.addColorStop(0.45, `rgba(${b.c}, ${b.a * 0.35})`);
      g.addColorStop(0.80, `rgba(${b.c}, ${b.a})`);
      g.addColorStop(1.00, `rgba(${b.c}, 0)`);
      b.grad = g;
    });
  }

  function draw(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (const b of bands) {
      ctx.fillStyle = b.grad;
      for (let x = 0; x <= W + STEP; x += STEP) {
        // srodek pasma: dwie nalozone fale (plynny, niepowtarzalny ruch)
        const cy = H * b.y
                 + Math.sin(x * b.f1 + t * b.s1) * b.amp * H
                 + Math.sin(x * b.f2 - t * b.s2 * 1.3) * b.amp * 0.6 * H;
        // wysokosc kurtyny falujaca w poziomie i w czasie
        const half = H * b.th * (0.75 + 0.25 * Math.sin(x * b.f3 + t * b.s3));
        // "promienie": pionowe smugi o zmiennej jasnosci
        ctx.globalAlpha = 0.72 + 0.28 * Math.sin(x * 0.045 + t * 0.0005 + b.y * 9) * Math.sin(x * 0.02 - t * 0.0003);
        ctx.setTransform(1, 0, 0, half, x, cy);
        ctx.fillRect(-STEP / 2, -1, STEP + 1, 2);
      }
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
  }

  resize();
  window.addEventListener('resize', () => { resize(); if (reduceMotion) draw(20000); });

  if (reduceMotion) { draw(20000); return; }     // bez animacji: jedna statyczna klatka
  (function loop(t) { draw(t); requestAnimationFrame(loop); })(performance.now());
})();

/* ============================================================
   KALKULATOR: walidacja danych
   Akceptuje przecinek lub kropke, spacje jako separator tysiecy.
   ============================================================ */
const amountEl = document.getElementById('amount');
const rateOutEl = document.getElementById('rate-out');
const tierNoteEl = document.getElementById('tier-note');
const resultsEl = document.getElementById('results');

/** Zamienia tekst na liczbe. Zwraca {empty} | {error} | {value}. */
function parseNumber(raw) {
  const s = raw.replace(/[\s ]/g, '').replace(',', '.');
  if (s === '') return { empty: true };
  if (!/^[+-]?\d+(\.\d+)?$/.test(s)) return { error: 'Wpisz poprawną liczbę (np. 1500 lub 12,5).' };
  const value = Number(s);
  if (!Number.isFinite(value)) return { error: 'Liczba jest zbyt duża.' };
  return { value };
}

function validateAmount(raw) {
  const p = parseNumber(raw);
  if (p.empty || p.error) return p;
  if (p.value <= 0) return { error: 'Kwota musi być większa od zera.' };
  if (p.value > 1e9) return { error: 'Maksymalna kwota to 1 000 000 000 PLN.' };
  return p;
}

/* ============================================================
   PROGI STOPY ZYSKU (rocznej) zaleznie od kwoty wpłaty.
   "do X" = wlacznie z X. Zmieniasz progi tutaj, w jednym miejscu.
   ============================================================ */
const TIERS = [
  { max: 1000,     pct: 15,   label: 'do 1 000 zł' },
  { max: 4000,     pct: 17,   label: 'od 1 000 do 4 000 zł' },
  { max: 8000,     pct: 18.5, label: 'od 4 000 do 8 000 zł' },
  { max: Infinity, pct: 20,   label: 'powyżej 8 000 zł' }
];
function tierFor(amount) {
  return TIERS.find(t => amount <= t.max);
}

/* ============================================================
   KALKULATOR: formatowanie liczb (polski format: 1 234,56 PLN)
   Grupowanie robimy recznie, bo pl-PL w Intl nie grupuje liczb 4-cyfrowych.
   ============================================================ */
function formatPLN(n) {
  const neg = n < 0 && Math.abs(n) >= 0.005;
  const [int, dec] = Math.abs(n).toFixed(2).split('.');
  const grouped = int.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return (neg ? '−' : '') + grouped + ',' + dec + ' PLN';
}
function formatPct(n, digits) {
  return n.toFixed(digits).replace('.', ',').replace('-', '−') + ' %';
}

/* ============================================================
   KALKULATOR: obliczenia
   Efektywna stopa miesieczna z rocznej stopy zysku (procent skladany):
     m = (1 + roczny/100)^(1/12) - 1
   Kapital po k miesiacach = kwota * (1 + m)^k
   ============================================================ */
function compute(amount, annualPct) {
  const m = Math.pow(1 + annualPct / 100, 1 / 12) - 1;
  const rows = [];
  let capital = amount;
  for (let month = 1; month <= 12; month++) {
    const gain = capital * m;
    capital += gain;
    rows.push({ month, gain, capital });
  }
  return { m, rows, final: capital, totalGain: capital - amount };
}

/* ============================================================
   KALKULATOR: wyswietlanie wynikow (na biezaco przy input)
   ============================================================ */
function setError(input, id, message) {
  document.getElementById(id).textContent = message || '';
  if (message) input.setAttribute('aria-invalid', 'true'); else input.removeAttribute('aria-invalid');
}

function update() {
  const a = validateAmount(amountEl.value);
  setError(amountEl, 'amount-err', a.error);

  if (a.value === undefined) {
    rateOutEl.textContent = '—';
    tierNoteEl.textContent = '';
    resultsEl.innerHTML = '<p class="placeholder">Wpisz kwotę wpłaty, aby zobaczyć symulację.</p>';
    return;
  }

  // stopa zysku dobierana automatycznie z progu kwoty
  const tier = tierFor(a.value);
  rateOutEl.textContent = formatPct(tier.pct, tier.pct % 1 ? 1 : 0);
  tierNoteEl.textContent = 'Próg: ' + tier.label;

  const res = compute(a.value, tier.pct);
  const dir = res.totalGain >= 0 ? 'up' : 'down';
  const sign = (n) => (n >= 0 ? '+' : '');
  const rowsHtml = res.rows.map(x => {
    const d = x.gain >= 0 ? 'up' : 'down';
    return `<tr><td>${x.month}</td><td class="${d}">${sign(x.gain)}${formatPLN(x.gain)}</td><td>${formatPLN(x.capital)}</td></tr>`;
  }).join('');

  resultsEl.innerHTML = `
    <div class="summary">
      <div class="tile"><div class="k">Kapitał po 12 miesiącach</div><div class="v">${formatPLN(res.final)}</div></div>
      <div class="tile"><div class="k">${res.totalGain >= 0 ? 'Łączny wzrost' : 'Łączny spadek'}</div><div class="v ${dir}">${sign(res.totalGain)}${formatPLN(res.totalGain)}</div></div>
    </div>
    <div class="table-wrap">
      <table>
        <caption>Rozkład wzrostu kapitału na 12 miesięcy</caption>
        <thead><tr><th scope="col">Miesiąc</th><th scope="col">Przyrost</th><th scope="col">Kapitał po miesiącu</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
    <div class="split">
      <div class="head">Obliczenie miesięczne</div>
      <div class="line"><span>Wpłata</span><b>${formatPLN(a.value)}</b></div>
      <div class="line"><span>+ Zysk (${formatPct(tier.pct, tier.pct % 1 ? 1 : 0)} rocznie)</span><b class="${dir}">${sign(res.totalGain)}${formatPLN(res.totalGain)}</b></div>
      <div class="line"><span>= Razem</span><b>${formatPLN(res.final)}</b></div>
      <div class="line total"><span>Razem ÷ 12 = miesięcznie</span><b>${formatPLN(res.final / 12)}</b></div>
      <div class="line"><span>Sam zysk ÷ 12</span><b class="${dir}">${sign(res.totalGain)}${formatPLN(res.totalGain / 12)}</b></div>
    </div>`;
}

amountEl.addEventListener('input', update);
</script>
</body>
</html>
